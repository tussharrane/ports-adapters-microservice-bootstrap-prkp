[package]
name = "__service_name__"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "__service_name__"
path = "src/main.rs"

[dependencies]
prost = "0.14"
rdkafka = { version = "0.36", default-features = false, features = ["dynamic-linking"] }
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"
signal-hook = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
